.form-switch .form-check-input:checked {

&lt;script&gt;
(async () =&gt; {
  const root = document.getElementById(&#x27;tempo-redukcji-inline&#x27;);
  const svg = root.querySelector(&#x27;.tempo-chart&#x27;);
  const tooltip = document.getElementById(&#x27;tempo-tooltip&#x27;);
  const svgNamespace = &#x27;http://www.w3.org/2000/svg&#x27;;
  const reduceMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  const weightDataUrl = new URL(&#x27;/data/waga.csv&#x27;, document.baseURI);
  const fetchWeightCsv = async () =&gt; {
    const requestUrl = new URL(weightDataUrl);
    requestUrl.searchParams.set(&#x27;updated&#x27;, Date.now().toString());
    const response = await fetch(requestUrl, { cache: &#x27;no-store&#x27; });
    if (!response.ok) {
      throw new Error(&#x27;Nie udało się pobrać DATA/waga.csv.&#x27;);
    }
    return response.text();
  };
  const parseWeightCsv = (source) =&gt; {
    const lines = source.trim().split(/\r?\n/).filter(Boolean);
    const headers = lines.shift().split(&#x27;,&#x27;);
    return lines.map((line) =&gt; {
      const values = line.split(&#x27;,&#x27;);
      return Object.fromEntries(
        headers.map((header, index) =&gt; [header, (values[index] ?? &#x27;&#x27;).trim()])
      );
    });
  };
  const selectMeasurements = (rows, recordType, startDate) =&gt;
    rows
      .filter((row) =&gt;
        row.typ_rekordu === recordType
        &amp;&amp; row.data &gt;= startDate
        &amp;&amp; Number.isFinite(Number(row.waga_kg))
      )
      .map((row) =&gt; ({ date: row.data, weight: Number(row.waga_kg) }))
      .sort((left, right) =&gt; left.date.localeCompare(right.date));
  const showDataError = (message) =&gt; {
    root.innerHTML =
      &#x27;&lt;div role=&quot;alert&quot; class=&quot;card tempo-error&quot;&gt;&#x27;
      + `&lt;strong&gt;${message}&lt;/strong&gt;&lt;br&gt;`

  };
  let csvSnapshot;

  const dailyMeasurements = selectMeasurements(

  if (weeklyActual.length === 0 || dailyMeasurements.length === 0) {

  window.setInterval(async () =&gt; {

  }, 10000);
  const targetWeight = 85;
  const parseDate = (value) =&gt; new Date(`${value}T12:00:00`);
  const dateKey = (date) =&gt; date.toISOString().slice(0, 10);
  const addDays = (date, days) =&gt; new Date(date.getTime() + days * 86400000);
  const planStartDate = &#x27;2026-07-18&#x27;;
  const planStartWeight = 107.4;
  const planEndDate = &#x27;2027-01-30&#x27;;
  const planDurationWeeks = Math.round(
    (parseDate(planEndDate) - parseDate(planStartDate)) / (7 * 86400000)
  );
  const weeklyLoss = (planStartWeight - targetWeight) / planDurationWeeks;
  const latestActual = weeklyActual.at(-1);
  const latestDaily = dailyMeasurements.at(-1);
  const formatWeight = (value) =&gt; `${value.toFixed(1).replace(&#x27;.&#x27;, &#x27;,&#x27;)} kg`;
  const formatDate = (value) =&gt; new Intl.DateTimeFormat(&#x27;pl-PL&#x27;, {

  }).format(parseDate(value));
  const formatShortDate = (value) =&gt; new Intl.DateTimeFormat(&#x27;pl-PL&#x27;, {
    day: &#x27;numeric&#x27;, month: &#x27;short&#x27;
  }).format(parseDate(value));
  const planned = Array.from({ length: planDurationWeeks + 1 }, (_, week) =&gt; ({
    date: dateKey(addDays(parseDate(planStartDate), week * 7)),

  const plannedWeightAt = (date) =&gt; {
    const elapsedWeeks = Math.max(0, Math.min(
      planDurationWeeks,
      (parseDate(date) - parseDate(planStartDate)) / (7 * 86400000)
    ));
    return +(planStartWeight - elapsedWeeks * weeklyLoss).toFixed(1);
  };
  const formatSignedWeight = (value) =&gt; {
    const sign = value &gt; 0 ? &#x27;+&#x27; : value &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;;
    return `${sign}${Math.abs(value).toFixed(1).replace(&#x27;.&#x27;, &#x27;,&#x27;)} kg`;
  };
  const previousActual = weeklyActual.length &gt; 1 ? weeklyActual.at(-2) : null;
  const currentDelta = previousActual ? +(latestActual.weight - previousActual.weight).toFixed(1) : null;
  const remainingToGoal = +(latestActual.weight - targetWeight).toFixed(1);
  const planPaceWeekly = -weeklyLoss;
  const plannedWeightAtLatest = plannedWeightAt(latestActual.date);
  const planDifference = +(latestActual.weight - plannedWeightAtLatest).toFixed(1);
  let recentPaceWeekly = null;
  if (weeklyActual.length &gt; 1) {
    const paceWindowStart = addDays(parseDate(latestActual.date), -28);
    let paceWindowPoints = weeklyActual.filter((point) =&gt; parseDate(point.date) &gt;= paceWindowStart);
    if (paceWindowPoints.length &lt; 2) paceWindowPoints = weeklyActual.slice(-2);
    const paceStart = paceWindowPoints[0];
    const paceElapsedDays = Math.max(1, (parseDate(latestActual.date) - parseDate(paceStart.date)) / 86400000);
    recentPaceWeekly = ((latestActual.weight - paceStart.weight) / paceElapsedDays) * 7;
  }
  const width = 720;
  const height = 390;
  const margin = { top: 30, right: 28, bottom: 58, left: 62 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const fullDomain = {
    dateMin: parseDate(weeklyActual[0].date).getTime(),
    dateMax: parseDate(planned.at(-1).date).getTime(),
    weightMin: 84,
    weightMax: 110
  };
  let currentDomain = { ...fullDomain };
  let animationFrame = null;
  let activeTooltipCircle = null;
  let panState = null;
  let suppressPointClick = false;

  const createSvgElement = (tag, attributes = {}) =&gt; {
    const element = document.createElementNS(svgNamespace, tag);
    Object.entries(attributes).forEach(([name, value]) =&gt; element.setAttribute(name, String(value)));

  };
  const setAttributes = (element, attributes) =&gt; {
    Object.entries(attributes).forEach(([name, value]) =&gt; element.setAttribute(name, String(value)));
  };

  const defs = createSvgElement(&#x27;defs&#x27;);
  const gradient = createSvgElement(&#x27;linearGradient&#x27;, {
    id: &#x27;tempo-actual-gradient&#x27;, x1: &#x27;0&#x27;, x2: &#x27;0&#x27;, y1: &#x27;0&#x27;, y2: &#x27;1&#x27;
  });
  gradient.append(
    createSvgElement(&#x27;stop&#x27;, { offset: &#x27;0%&#x27;, &#x27;stop-color&#x27;: &#x27;var(--viz-series-1)&#x27;, &#x27;stop-opacity&#x27;: &#x27;0.25&#x27; }),
    createSvgElement(&#x27;stop&#x27;, { offset: &#x27;100%&#x27;, &#x27;stop-color&#x27;: &#x27;var(--viz-series-1)&#x27;, &#x27;stop-opacity&#x27;: &#x27;0&#x27; })
  );
  const clipPath = createSvgElement(&#x27;clipPath&#x27;, { id: &#x27;tempo-plot-clip&#x27; });
  clipPath.append(createSvgElement(&#x27;rect&#x27;, {
    x: margin.left, y: margin.top, width: plotWidth, height: plotHeight
  }));
  defs.append(gradient, clipPath);
  svg.append(defs);

  const gridLayer = createSvgElement(&#x27;g&#x27;);
  const plotLayer = createSvgElement(&#x27;g&#x27;, { &#x27;clip-path&#x27;: &#x27;url(#tempo-plot-clip)&#x27; });
  const labelLayer = createSvgElement(&#x27;g&#x27;);
  svg.append(gridLayer, plotLayer, labelLayer);
  const yGrid = Array.from({ length: 7 }, () =&gt; ({
    line: createSvgElement(&#x27;line&#x27;, { class: &#x27;tempo-grid&#x27; }),
    label: createSvgElement(&#x27;text&#x27;, { &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;tempo-axis text-small&#x27; })
  }));
  yGrid.forEach(({ line, label }) =&gt; gridLayer.append(line, label));
  const xTicks = Array.from({ length: 4 }, () =&gt; ({
    line: createSvgElement(&#x27;line&#x27;, { class: &#x27;tempo-axis-line&#x27; }),
    label: createSvgElement(&#x27;text&#x27;, { &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;tempo-date-label text-small&#x27; })
  }));
  xTicks.forEach(({ line, label }) =&gt; gridLayer.append(line, label));
  gridLayer.append(
    createSvgElement(&#x27;line&#x27;, {
      x1: margin.left, x2: width - margin.right, y1: height - margin.bottom, y2: height - margin.bottom, class: &#x27;tempo-axis-line&#x27;
    }),
    createSvgElement(&#x27;line&#x27;, {
      x1: margin.left, x2: margin.left, y1: margin.top, y2: height - margin.bottom, class: &#x27;tempo-axis-line&#x27;
    })
  );
  const actualArea = createSvgElement(&#x27;path&#x27;, { class: &#x27;tempo-actual-area&#x27; });
  const goalLine = createSvgElement(&#x27;line&#x27;, { class: &#x27;tempo-goal-line&#x27; });
  const planPath = createSvgElement(&#x27;path&#x27;, { class: &#x27;tempo-plan-path&#x27; });
  const dailyPath = createSvgElement(&#x27;path&#x27;, { class: &#x27;tempo-daily-path&#x27; });
  const actualPath = createSvgElement(&#x27;path&#x27;, { class: &#x27;tempo-actual-path&#x27; });
  plotLayer.append(actualArea, goalLine, planPath, dailyPath, actualPath);
  const pulseCircle = createSvgElement(&#x27;circle&#x27;, { class: &#x27;tempo-pulse&#x27;, r: 6 });
  plotLayer.append(pulseCircle);
  const goalLabel = createSvgElement(&#x27;text&#x27;, {
    &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;tempo-goal-label text-small&#x27;
  });
  goalLabel.textContent = &#x27;CEL 85 KG&#x27;;
  const currentLabel = createSvgElement(&#x27;text&#x27;, {
    &#x27;text-anchor&#x27;: &#x27;start&#x27;, class: &#x27;tempo-current-label text-small&#x27;
  });
  currentLabel.textContent = formatWeight(latestActual.weight);
  const dailyLabel = createSvgElement(&#x27;text&#x27;, {
    &#x27;text-anchor&#x27;: &#x27;start&#x27;, class: &#x27;tempo-daily-label text-small&#x27;
  });
  dailyLabel.textContent = formatWeight(latestDaily.weight);
  labelLayer.append(goalLabel, currentLabel, dailyLabel);

  const planPoints = planned.map((point) =&gt; {

  const actualPoints = weeklyActual.map((point, index) =&gt; {
    const previous = index &gt; 0 ? weeklyActual[index - 1] : null;
    const deltaLine = previous
      ? `\nZmiana: ${formatSignedWeight(+(point.weight - previous.weight).toFixed(1))}`
      : &#x27;&#x27;;
    const tooltip = `Data: ${formatDate(point.date)}\nWaga: ${formatWeight(point.weight)}${deltaLine}`;
    const circle = createSvgElement(&#x27;circle&#x27;, {
      r: index === weeklyActual.length - 1 ? 6 : 5,
      class: `tempo-point tempo-actual-point${index === weeklyActual.length - 1 ? &#x27; tempo-latest-point&#x27; : &#x27;&#x27;}`,

  });
  const dailyPoints = dailyMeasurements.map((point, index) =&gt; {
    const tooltip = `Data: ${formatDate(point.date)}\nWaga: ${formatWeight(point.weight)}`;
    const circle = createSvgElement(&#x27;circle&#x27;, {
      r: index === dailyMeasurements.length - 1 ? 5.5 : 4,

    });

  });
  [...planPoints, ...actualPoints, ...dailyPoints].forEach(({ circle }) =&gt; {
    circle.addEventListener(&#x27;pointerenter&#x27;, () =&gt; {
      showTooltip(circle);
      if (reduceMotion) return;
      circle.animate(
        [{ transform: &#x27;scale(1)&#x27; }, { transform: &#x27;scale(1.42)&#x27; }, { transform: &#x27;scale(1.12)&#x27; }],
        { duration: 320, easing: &#x27;cubic-bezier(0.22, 1, 0.36, 1)&#x27;, fill: &#x27;forwards&#x27; }

  function positionTooltip(circle) {

    const center = markRect.left + markRect.width / 2;
    const halfWidth = tooltipRect.width / 2;

    const fitsAbove = markRect.top - tooltipRect.height - 10 &gt;= 5;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${fitsAbove ? markRect.top - 10 : markRect.bottom + 10}px`;
    tooltip.style.transform = fitsAbove ? &#x27;translate(-50%, -100%)&#x27; : &#x27;translate(-50%, 0)&#x27;;
  }

  function showTooltip(circle) {

  const scaleX = (date, domain) =&gt; margin.left + ((parseDate(date).getTime() - domain.dateMin) / (domain.dateMax - domain.dateMin)) * plotWidth;
  const scaleY = (weight, domain) =&gt; margin.top + ((domain.weightMax - weight) / (domain.weightMax - domain.weightMin)) * plotHeight;
  const linePath = (points, domain) =&gt; points.map((point, index) =&gt; `${index === 0 ? &#x27;M&#x27; : &#x27;L&#x27;} ${scaleX(point.date, domain).toFixed(2)} ${scaleY(point.weight, domain).toFixed(2)}`).join(&#x27; &#x27;);
  const areaPath = (points, domain) =&gt; {
    const baseline = height - margin.bottom;
    return `${linePath(points, domain)} L ${scaleX(points.at(-1).date, domain).toFixed(2)} ${baseline} L ${scaleX(points[0].date, domain).toFixed(2)} ${baseline} Z`;

  function clampViewportDomain(domain) {
    const clampRange = (min, max, boundMin, boundMax) =&gt; {

    setAttributes(goalLine, {

    });
    setAttributes(goalLabel, {
      x: width - margin.right, y: y(targetWeight) - 8,

    });
    setAttributes(currentLabel, {
      x: x(latestActual.date) + 10, y: y(latestActual.weight) - 10,
      visibility: x(latestActual.date) &gt;= margin.left &amp;&amp; x(latestActual.date) &lt;= width - margin.right &amp;&amp; y(latestActual.weight) &gt;= margin.top &amp;&amp; y(latestActual.weight) &lt;= height - margin.bottom ? &#x27;visible&#x27; : &#x27;hidden&#x27;
    });
    setAttributes(dailyLabel, {
      x: x(latestDaily.date) + 10, y: y(latestDaily.weight) + 17,
      visibility: x(latestDaily.date) &gt;= margin.left &amp;&amp; x(latestDaily.date) &lt;= width - margin.right &amp;&amp; y(latestDaily.weight) &gt;= margin.top &amp;&amp; y(latestDaily.weight) &lt;= height - margin.bottom ? &#x27;visible&#x27; : &#x27;hidden&#x27;
    });

    actualPoints.forEach(({ point, circle }) =&gt; setAttributes(circle, { cx: x(point.date), cy: y(point.weight) }));

    setAttributes(pulseCircle, { cx: x(latestActual.date), cy: y(latestActual.weight) });
    yGrid.forEach(({ line, label }, index) =&gt; {
      const value = domain.weightMin + ((domain.weightMax - domain.weightMin) * index) / (yGrid.length - 1);
      const yValue = y(value);
      setAttributes(line, { x1: margin.left, x2: width - margin.right, y1: yValue, y2: yValue });

      const dateValue = domain.dateMin + ((domain.dateMax - domain.dateMin) * index) / (xTicks.length - 1);
      const xValue = margin.left + (plotWidth * index) / (xTicks.length - 1);
      setAttributes(line, {
        x1: xValue, x2: xValue, y1: height - margin.bottom, y2: height - margin.bottom + 5
      });
      setAttributes(label, { x: xValue, y: height - margin.bottom + 24 });
      label.textContent = formatShortDate(dateKey(new Date(dateValue)));

  }

  const maxZoom = 8;
  const fullDateSpan = fullDomain.dateMax - fullDomain.dateMin;
  const fullWeightSpan = fullDomain.weightMax - fullDomain.weightMin;
  const minDateSpan = fullDateSpan / maxZoom;
  const minWeightSpan = fullWeightSpan / maxZoom;
  const clampNum = (value, min, max) =&gt; Math.min(max, Math.max(min, value));

  function domainPointFromPixel(position, domain) {
    return {
      date: domain.dateMin + ((position.x - margin.left) / plotWidth) * (domain.dateMax - domain.dateMin),
      weight: domain.weightMax - ((position.y - margin.top) / plotHeight) * (domain.weightMax - domain.weightMin)
    };
  }

  function zoomToward(anchor, factor, domain) {
    const dateSpan = clampNum((domain.dateMax - domain.dateMin) / factor, minDateSpan, fullDateSpan);
    const weightSpan = clampNum((domain.weightMax - domain.weightMin) / factor, minWeightSpan, fullWeightSpan);
    const dateRatio = (anchor.date - domain.dateMin) / (domain.dateMax - domain.dateMin);
    const weightRatioFromTop = (domain.weightMax - anchor.weight) / (domain.weightMax - domain.weightMin);
    const dateMin = anchor.date - dateRatio * dateSpan;
    const weightMax = anchor.weight + weightRatioFromTop * weightSpan;
    return clampViewportDomain({
      dateMin, dateMax: dateMin + dateSpan,
      weightMin: weightMax - weightSpan, weightMax
    });
  }

  function animateTo(nextDomain) {
    if (animationFrame != null) cancelAnimationFrame(animationFrame);
    if (reduceMotion) {
      currentDomain = nextDomain;
      render(currentDomain);
      return;
    }
    const startDomain = { ...currentDomain };
    const startTime = performance.now();
    const duration = 420;
    const ease = (value) =&gt; 1 - Math.pow(1 - value, 3);
    const step = (now) =&gt; {
      const progress = Math.min(1, (now - startTime) / duration);
      const eased = ease(progress);
      currentDomain = Object.fromEntries(Object.keys(startDomain).map((key) =&gt; [
        key, startDomain[key] + (nextDomain[key] - startDomain[key]) * eased
      ]));
      render(currentDomain);
      if (progress &lt; 1) animationFrame = requestAnimationFrame(step);
      else animationFrame = null;
    };
    animationFrame = requestAnimationFrame(step);
  }

  function pointerPosition(event) {
    const rect = svg.getBoundingClientRect();
    return {
      x: ((event.clientX - rect.left) / rect.width) * width,
      y: ((event.clientY - rect.top) / rect.height) * height
    };
  }

  svg.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
    if (event.button !== 0) return;
    const position = pointerPosition(event);
    const insidePlot = position.x &gt;= margin.left &amp;&amp; position.x &lt;= width - margin.right
      &amp;&amp; position.y &gt;= margin.top &amp;&amp; position.y &lt;= height - margin.bottom;
    if (!insidePlot) return;
    if (animationFrame != null) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
    hideTooltip();
    panState = {
      pointerId: event.pointerId,
      start: position,
      domain: { ...currentDomain },
      moved: false
    };
    svg.setPointerCapture(event.pointerId);
    root.classList.add(&#x27;is-panning&#x27;);
    event.preventDefault();
  });

  svg.addEventListener(&#x27;pointermove&#x27;, (event) =&gt; {
    if (panState == null || event.pointerId !== panState.pointerId) return;
    const position = pointerPosition(event);
    const deltaX = position.x - panState.start.x;
    const deltaY = position.y - panState.start.y;
    if (Math.abs(deltaX) &gt; 3 || Math.abs(deltaY) &gt; 3) panState.moved = true;
    const dateSpan = panState.domain.dateMax - panState.domain.dateMin;
    const weightSpan = panState.domain.weightMax - panState.domain.weightMin;
    const dateShift = -(deltaX / plotWidth) * dateSpan;
    const weightShift = (deltaY / plotHeight) * weightSpan;
    currentDomain = clampViewportDomain({
      dateMin: panState.domain.dateMin + dateShift,
      dateMax: panState.domain.dateMax + dateShift,
      weightMin: panState.domain.weightMin + weightShift,
      weightMax: panState.domain.weightMax + weightShift
    });
    render(currentDomain);
    event.preventDefault();
  });

  const finishPan = (event) =&gt; {
    if (panState == null || event.pointerId !== panState.pointerId) return;
    suppressPointClick = panState.moved;
    panState = null;
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    root.classList.remove(&#x27;is-panning&#x27;);
    setTimeout(() =&gt; { suppressPointClick = false; }, 0);
  };
  svg.addEventListener(&#x27;pointerup&#x27;, finishPan);
  svg.addEventListener(&#x27;pointercancel&#x27;, finishPan);

  svg.addEventListener(&#x27;dblclick&#x27;, (event) =&gt; {
    const position = pointerPosition(event);
    const insidePlot = position.x &gt;= margin.left &amp;&amp; position.x &lt;= width - margin.right
      &amp;&amp; position.y &gt;= margin.top &amp;&amp; position.y &lt;= height - margin.bottom;

    animateTo(zoomToward(anchor, 2, currentDomain));
  });

  svg.addEventListener(&#x27;wheel&#x27;, (event) =&gt; {
    const position = pointerPosition(event);
    const insidePlot = position.x &gt;= margin.left &amp;&amp; position.x &lt;= width - margin.right
      &amp;&amp; position.y &gt;= margin.top &amp;&amp; position.y &lt;= height - margin.bottom;
    if (!insidePlot) return;
    event.preventDefault();
    if (animationFrame != null) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
    hideTooltip();
    if (event.ctrlKey) {
      const anchor = domainPointFromPixel(position, currentDomain);
      const factor = Math.exp(-event.deltaY * 0.01);
      currentDomain = zoomToward(anchor, factor, currentDomain);
    } else {
      const dateSpan = currentDomain.dateMax - currentDomain.dateMin;
      const weightSpan = currentDomain.weightMax - currentDomain.weightMin;
      const dateShift = (event.deltaX / plotWidth) * dateSpan;
      const weightShift = -(event.deltaY / plotHeight) * weightSpan;
      currentDomain = clampViewportDomain({
        dateMin: currentDomain.dateMin + dateShift,
        dateMax: currentDomain.dateMax + dateShift,
        weightMin: currentDomain.weightMin + weightShift,
        weightMax: currentDomain.weightMax + weightShift
      });
    }
    render(currentDomain);
  }, { passive: false });

  function paceStatus(paceWeekly) {
    if (paceWeekly == null) return &#x27;unknown&#x27;;
    if (paceWeekly &lt;= planPaceWeekly) return &#x27;ahead&#x27;;
    if (paceWeekly &lt; 0) return &#x27;behind&#x27;;
    return &#x27;bad&#x27;;
  }

  function initDashboard() {
    const currentEl = document.getElementById(&#x27;stat-current&#x27;);
    const deltaEl = document.getElementById(&#x27;stat-current-delta&#x27;);
    const remainingEl = document.getElementById(&#x27;stat-remaining&#x27;);
    const paceEl = document.getElementById(&#x27;stat-pace&#x27;);
    const planProgressEl = document.getElementById(&#x27;stat-plan-progress&#x27;);
    const planDetailEl = document.getElementById(&#x27;stat-plan-detail&#x27;);
    const chip = document.getElementById(&#x27;tempo-pace-chip&#x27;);
    const chipText = document.getElementById(&#x27;tempo-pace-chip-text&#x27;);
    const paceFill = document.getElementById(&#x27;tempo-pace-fill&#x27;);
    const paceMarker = document.getElementById(&#x27;tempo-pace-marker&#x27;);
    const paceTick = root.querySelector(&#x27;.tempo-pace-tick&#x27;);

    currentEl.textContent = formatWeight(latestActual.weight);
    if (currentDelta == null) {
      deltaEl.textContent = &#x27;Pierwszy pomiar&#x27;;
    } else {
      deltaEl.textContent = `${formatSignedWeight(currentDelta)} vs poprz. tydz.`;
      deltaEl.classList.add(currentDelta &lt;= 0 ? &#x27;is-down&#x27; : &#x27;is-up&#x27;);
    }
    remainingEl.textContent = formatWeight(Math.max(0, remainingToGoal));
    const planPosition = planDifference &lt;= -0.1 ? &#x27;Przed planem&#x27;
      : planDifference &gt;= 0.1 ? &#x27;Za planem&#x27;
      : &#x27;Zgodnie z planem&#x27;;
    planProgressEl.textContent = planPosition;
    planDetailEl.textContent = `${formatSignedWeight(planDifference)} względem ${formatWeight(plannedWeightAtLatest)} na ${formatShortDate(latestActual.date)}`;

    const status = paceStatus(recentPaceWeekly);
    const statusClass = status === &#x27;ahead&#x27; ? &#x27;is-ahead&#x27;
      : status === &#x27;behind&#x27; ? &#x27;is-behind&#x27;
      : status === &#x27;bad&#x27; ? &#x27;is-bad&#x27; : &#x27;&#x27;;
    paceEl.textContent = recentPaceWeekly == null ? &#x27;—&#x27; : `${formatSignedWeight(recentPaceWeekly)}/tydz.`;
    if (statusClass) {
      chip.classList.add(statusClass);
      paceFill.classList.add(statusClass);
      paceMarker.classList.add(statusClass);
    }
    chipText.textContent = status === &#x27;ahead&#x27; ? &#x27;Szybciej niż plan&#x27;
      : status === &#x27;behind&#x27; ? &#x27;Wolniej niż plan&#x27;
      : status === &#x27;bad&#x27; ? &#x27;Przyrost masy&#x27;
      : &#x27;Brak danych&#x27;;

    if (recentPaceWeekly != null) {
      const scaleMin = 0.6;
      const scaleMax = -Math.max(1.6, Math.abs(recentPaceWeekly) * 1.15, Math.abs(planPaceWeekly) * 2);
      const pct = (value) =&gt; {
        const clamped = Math.min(scaleMin, Math.max(scaleMax, value));
        return ((scaleMin - clamped) / (scaleMin - scaleMax)) * 100;
      };
      const referencePct = pct(planPaceWeekly);
      const actualPct = pct(recentPaceWeekly);
      paceTick.style.left = `${referencePct}%`;
      paceFill.style.left = `${Math.min(referencePct, actualPct)}%`;
      paceFill.style.width = `${Math.abs(actualPct - referencePct)}%`;
      paceMarker.style.left = `${actualPct}%`;
    }
  }

  function playEntranceAnimation() {
    if (reduceMotion) return;
    [actualPath, planPath, dailyPath].forEach((path, index) =&gt; {
      const length = path.getTotalLength();
      if (!length) return;
      path.style.strokeDasharray = `${length}`;
      path.style.strokeDashoffset = `${length}`;
      const anim = path.animate(
        [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
        { duration: 900, delay: index * 120, easing: &#x27;cubic-bezier(0.22, 1, 0.36, 1)&#x27;, fill: &#x27;forwards&#x27; }
      );
      anim.addEventListener(&#x27;finish&#x27;, () =&gt; {
        path.style.removeProperty(&#x27;stroke-dasharray&#x27;);
        path.style.removeProperty(&#x27;stroke-dashoffset&#x27;);
      });
    });
    actualArea.animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: 700, delay: 250, easing: &#x27;ease-out&#x27;, fill: &#x27;backwards&#x27; }
    );
    [...planPoints, ...actualPoints, ...dailyPoints].forEach(({ circle }, index) =&gt; {
      circle.animate(
        [
          { transform: &#x27;scale(0)&#x27;, opacity: 0 },
          { transform: &#x27;scale(1.25)&#x27;, opacity: 1, offset: 0.7 },
          { transform: &#x27;scale(1)&#x27;, opacity: 1 }
        ],
        { duration: 480, delay: Math.min(260 + index * 10, 900), easing: &#x27;cubic-bezier(0.22, 1, 0.36, 1)&#x27;, fill: &#x27;backwards&#x27; }
      );
    });
  }

  if (reduceMotion) root.classList.add(&#x27;reduce-motion&#x27;);
  render(currentDomain);
  initDashboard();
  playEntranceAnimation();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
