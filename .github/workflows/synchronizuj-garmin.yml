name: Synchronizuj dane Garmin

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Zakres synchronizacji"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - activities
          - weight
      activity_days:
        description: "Liczba dni aktywności do sprawdzenia"
        required: true
        default: "14"
      weight_days:
        description: "Liczba dni pomiarów wagi do sprawdzenia"
        required: true
        default: "14"
  schedule:
    # GitHub Actions używa UTC. Pary godzin obsługują czas letni i zimowy.
    # Aktywności: 06:30, 12:30, 18:30 i 23:30 Europe/Warsaw.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
    # Waga: 10:00 i 17:00 Europe/Warsaw.
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: synchronizacja-garmin
  cancel-in-progress: false

jobs:
  synchronizuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wybierz zakres właściwy dla czasu Warszawy
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_ACTIVITY_DAYS: ${{ inputs.activity_days }}
          REQUESTED_WEIGHT_DAYS: ${{ inputs.weight_days }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$REQUESTED_MODE" in
              all|activities|weight) mode="$REQUESTED_MODE" ;;
              *) echo "Nieprawidłowy tryb: $REQUESTED_MODE" >&2; exit 2 ;;
            esac
            case "$REQUESTED_ACTIVITY_DAYS" in
              ''|*[!0-9]*) echo "Nieprawidłowe activity_days." >&2; exit 2 ;;
              *) activity_days="$REQUESTED_ACTIVITY_DAYS" ;;
            esac
            case "$REQUESTED_WEIGHT_DAYS" in
              ''|*[!0-9]*) echo "Nieprawidłowe weight_days." >&2; exit 2 ;;
              *) weight_days="$REQUESTED_WEIGHT_DAYS" ;;
            esac
          else
            # Harmonogram GitHuba jest kolejką: bieg zaplanowany na 04:30 UTC
            # potrafi ruszyć kilkanaście minut później. Dlatego o zakresie
            # decyduje wpis crona, który wyzwolił bieg, a nie odczyt zegara.
            # Zegar rozstrzyga wyłącznie, która połowa pary letnia/zimowa
            # odpowiada dziś właściwej godzinie w Warszawie.
            offset=$(TZ=Europe/Warsaw date +%z)
            case "$offset" in
              +0100|+0200) ;;
              *) echo "Nieoczekiwane przesunięcie strefy Europe/Warsaw: $offset" >&2; exit 2 ;;
            esac
            case "$offset|$SCHEDULE" in
              "+0200|30 4 * * *")  mode="activities" ;;  # 06:30 czasu letniego
              "+0100|30 5 * * *")  mode="activities" ;;  # 06:30 czasu zimowego
              "+0200|30 10 * * *") mode="activities" ;;  # 12:30 czasu letniego
              "+0100|30 11 * * *") mode="activities" ;;  # 12:30 czasu zimowego
              "+0200|30 16 * * *") mode="activities" ;;  # 18:30 czasu letniego
              "+0100|30 17 * * *") mode="activities" ;;  # 18:30 czasu zimowego
              "+0200|30 21 * * *") mode="activities" ;;  # 23:30 czasu letniego
              "+0100|30 22 * * *") mode="activities" ;;  # 23:30 czasu zimowego
              "+0200|0 8 * * *")   mode="weight" ;;      # 10:00 czasu letniego
              "+0100|0 9 * * *")   mode="weight" ;;      # 10:00 czasu zimowego
              "+0200|0 15 * * *")  mode="weight" ;;      # 17:00 czasu letniego
              "+0100|0 16 * * *")  mode="weight" ;;      # 17:00 czasu zimowego
              *)
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "Pominięto drugą połowę pary letnia/zimowa: cron '$SCHEDULE' przy przesunięciu $offset."
                exit 0
                ;;
            esac
            activity_days=14
            weight_days=14
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "activity_days=$activity_days" >> "$GITHUB_OUTPUT"
          echo "weight_days=$weight_days" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Zainstaluj zależność Garmin
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --requirement PROJECTS/forma_zycia/automatyzacja/requirements-garmin.txt

      - name: Odtwórz token Garmin
        if: steps.scope.outputs.run == 'true'
        env:
          GARMIN_TOKENS_JSON_B64: ${{ secrets.GARMIN_TOKENS_JSON_B64 }}
        run: |
          test -n "$GARMIN_TOKENS_JSON_B64"
          umask 077
          mkdir -p "$RUNNER_TEMP/garmin-token"
          printf '%s' "$GARMIN_TOKENS_JSON_B64" | base64 --decode > "$RUNNER_TEMP/garmin-token/garmin_tokens.json"

      - name: Synchronizuj dane
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          python PROJECTS/forma_zycia/automatyzacja/synchronizuj_garmin.py \
            --mode "${{ steps.scope.outputs.mode }}" \
            --token-store "$RUNNER_TEMP/garmin-token" \
            --days "${{ steps.scope.outputs.weight_days }}" \
            --activity-days "${{ steps.scope.outputs.activity_days }}" \
            --lock-file "$RUNNER_TEMP/garmin-sync.lock" \
            | tee "$RUNNER_TEMP/garmin-sync.log"
          # Odświeżony token żyje tylko w tej maszynie, więc sekret starzeje się
          # po cichu. To jedyne ostrzeżenie przed dniem, w którym przestanie
          # działać; treść tokenu nie trafia ani do logu, ani do ostrzeżenia.
          if grep -q 'garmin-token-refreshed' "$RUNNER_TEMP/garmin-sync.log"; then
            echo "::warning::Garmin odświeżył token podczas tego biegu. Sekret GARMIN_TOKENS_JSON_B64 jest sprzed odświeżenia — odnów go zgodnie z sekcją „Odnawianie tokenu” w PROJECTS/forma_zycia/automatyzacja/README.md."
          fi

      - name: Zapisz dane w prywatnym repozytorium
        if: steps.scope.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- DATA/waga.csv DATA/garmin/aktywnosci.csv)" ]; then
            echo "Brak nowych danych Garmin."
            exit 0
          fi
          git config user.name "garmin-sync[bot]"
          git config user.email "garmin-sync[bot]@users.noreply.github.com"
          git add -- DATA/waga.csv DATA/garmin/aktywnosci.csv
          git commit \
            -m "Aktualizuj dane Garmin: ${{ steps.scope.outputs.mode }}" \
            -m "Intencja: zachować aktualną historię treningów i wagi w prywatnym repozytorium bez zapisywania surowych plików ani danych uwierzytelniających."
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Konflikt między danymi z tego biegu a origin/main. Nic nie zostało wypchnięte; dane wrócą przy kolejnej synchronizacji, gdy rozbieżność zostanie ręcznie rozstrzygnięta."
            exit 1
          fi
          git push origin HEAD:main
